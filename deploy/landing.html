<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Claude Multiplayer server</title>
<style>
  :root { --bg: #141413; --card: #1c1b19; --line: #2e2c29; --text: #f0eee6; --dim: #9c988e; --accent: #d97757; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 16px;
    background: radial-gradient(ellipse at 50% 35%, #1f1d1a 0%, var(--bg) 65%);
    color: var(--text); font: 14px/1.6 'JetBrains Mono', Consolas, 'Courier New', monospace;
  }
  main { width: 100%; max-width: 460px; text-align: center; }
  svg { width: 64px; height: 64px; stroke: var(--accent); stroke-linecap: round; animation: spin 24s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { margin: 18px 0 4px; font-size: 20px; letter-spacing: 3px; font-weight: 600; }
  h1 b { color: var(--accent); font-weight: 700; }
  p { margin: 0; color: var(--dim); }
  .addr {
    display: flex; align-items: center; gap: 8px; margin: 26px 0 14px; padding: 10px 10px 10px 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; text-align: left;
  }
  .addr code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .addr code::before { content: '$ '; color: var(--accent); }
  button {
    all: unset; cursor: pointer; padding: 4px 10px; border: 1px solid var(--line); border-radius: 5px;
    color: var(--dim); font-size: 12px; transition: color .15s, border-color .15s;
  }
  button:hover, button.ok { color: var(--accent); border-color: var(--accent); }
  .hint { font-size: 12px; }
  .gh { display: inline-flex; align-items: center; gap: 6px; margin-top: 22px; color: var(--dim); font-size: 12px; text-decoration: none; transition: color .15s; }
  .gh:hover { color: var(--accent); }
  .gh svg { width: 14px; height: 14px; fill: currentColor; stroke: none; animation: none; }
  @media (prefers-reduced-motion: reduce) { svg { animation: none; } }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <line x1="50" y1="50" x2="50" y2="8" stroke-width="9"/><line x1="50" y1="50" x2="68.1" y2="23.6" stroke-width="7"/>
    <line x1="50" y1="50" x2="86.4" y2="29" stroke-width="9"/><line x1="50" y1="50" x2="79.8" y2="53.1" stroke-width="7"/>
    <line x1="50" y1="50" x2="86.4" y2="71" stroke-width="9"/><line x1="50" y1="50" x2="68.1" y2="76.4" stroke-width="7"/>
    <line x1="50" y1="50" x2="50" y2="92" stroke-width="9"/><line x1="50" y1="50" x2="31.9" y2="76.4" stroke-width="7"/>
    <line x1="50" y1="50" x2="13.6" y2="71" stroke-width="9"/><line x1="50" y1="50" x2="20.2" y2="46.9" stroke-width="7"/>
    <line x1="50" y1="50" x2="13.6" y2="29" stroke-width="9"/><line x1="50" y1="50" x2="31.9" y2="23.6" stroke-width="7"/>
  </svg>
  <h1><b>CLAUDE</b> MULTIPLAYER</h1>
  <p>community server</p>
  <div class="addr">
    <code id="addr">https://{{DOMAIN}}</code>
    <button type="button" id="copy">copy</button>
  </div>
  <p class="hint">Add this address in the Claude Multiplayer app to join.</p>
  <a class="gh" href="https://github.com/rxxddy/claude-multiplayer" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.6 0 0 3.6 0 8c0 3.5 2.3 6.5 5.5 7.6.4.1.5-.2.5-.4v-1.4c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.3 1.9.9 2.4.7.1-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8.6-.2 1.3-.3 2-.3s1.4.1 2 .3c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.7-3.6 3.9.3.3.5.8.5 1.5v2.2c0 .2.1.5.6.4C13.7 14.5 16 11.5 16 8c0-4.4-3.6-8-8-8z"/></svg>
    rxxddy/claude-multiplayer
  </a>
</main>
<script>
  document.getElementById('copy').addEventListener('click', function () {
    var btn = this;
    navigator.clipboard.writeText(document.getElementById('addr').textContent).then(function () {
      btn.textContent = 'copied';
      btn.classList.add('ok');
      setTimeout(function () { btn.textContent = 'copy'; btn.classList.remove('ok'); }, 1500);
    });
  });
</script>
</body>
</html>
