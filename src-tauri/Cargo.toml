[package]
name = "claude-multiplayer"
version = "1.0.6"
description = "Multiplayer terminal for teams coding with Claude Code"
authors = ["rxxddy"]
license = "MIT"
repository = "https://github.com/rxxddy/claude-multiplayer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
keyring = { version = "3", features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "5"
ureq = { version = "2", features = ["json"] }
